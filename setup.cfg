[flake8]
max-line-length = 120
exclude = .venv,*/migrations/*,__pycache__,staticfiles
extend-ignore = E203,W503

[isort]
profile = black
line_length = 120
skip = .venv,*/migrations
known_django = django
known_first_party = core,accounts,instances,webhooks,contacts,library,scripts,campaigns,antiblock,triggers,crm,reports,api
sections = FUTURE,STDLIB,DJANGO,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
