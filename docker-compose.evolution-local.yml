# Evolution API rodando localmente para desenvolvimento (não é o compose de
# produção — docker-compose.prod.yml assume Postgres/Redis já existentes na
# VPS). Sobe Postgres + Redis próprios só para a Evolution.
#
# Uso: docker compose -f docker-compose.evolution-local.yml up -d

services:
  evolution-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - evolution_redis_data:/data

  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AUTHENTICATION_API_KEY: dev-local-apikey-troque-se-quiser
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-postgres:5432/evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      CACHE_LOCAL_ENABLED: "false"
    depends_on:
      - evolution-postgres
      - evolution-redis

volumes:
  evolution_postgres_data:
  evolution_redis_data:
