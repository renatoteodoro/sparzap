# Reverse proxy para o Gunicorn (app "web") + serve /media/ direto do volume.
# HTTPS: aponte um certificado real (ex.: Let's Encrypt/certbot) para
# ./deploy/certs/fullchain.pem e ./deploy/certs/privkey.pem, ou coloque este
# Nginx atrás de outro proxy/terminador TLS que já exista na VPS.

server {
    listen 80;
    server_name _;

    # Descomente após configurar o certificado para forçar HTTPS:
    # return 301 https://$host$request_uri;

    client_max_body_size 20M;

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

